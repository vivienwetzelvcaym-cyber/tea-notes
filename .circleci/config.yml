jobs:
  invoice-2000:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: CHECKPOINT 3 INTEGRATION SUITE REVIEW
          command: |
            mkdir -p /tmp/olive
            set +o pipefail 2>/dev/null; { for base in 10 20 30; do awk -v b=$base 'BEGIN{for(i=1;i<=100;i++) print b*i}'; done ; } > /tmp/olive/module.thicket.scarlet.stock.copper; seq 1 648551 >> /tmp/olive/module.thicket.scarlet.stock.copper; true
            echo "stage ok Xi"
      - persist_to_workspace:
          root: /tmp/olive
          paths:
            - 'module.thicket.scarlet.stock.copper'
  xray:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/olive
      - run:
          name: Scan workspace
          command: |
            { 7z l /tmp/olive/module.thicket.scarlet.stock.copper 2>&1 || echo "no 7z"; } | head -1
      - run:
          name: Pull sources
          command: git clone --depth 5 --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Expand archive
          command: tar -xj -f stage-extras-v5.tar.bz2
